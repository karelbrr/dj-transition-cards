[project]
name = "dj-transition-cards"
version = "0.1.0"
description = "Adds the cover art and titles of the two tracks of a DJ transition clip onto the video, for TikTok and Reels."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "moviepy>=2.2",
    "pillow>=11",
    "pyacrcloud>=1.0.12",
    "python-dotenv>=1.0",
]

[project.scripts]
dj-cards = "dj_transition_cards.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dj_transition_cards"]
